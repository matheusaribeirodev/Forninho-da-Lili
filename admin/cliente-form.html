<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- O painel nunca deve aparecer no Google -->
<meta name="robots" content="noindex, nofollow">
<title>Cliente | Painel Forninho da Lili</title>
<link rel="icon" href="../assets/img/logo-selo.jpg">
<link rel="stylesheet" href="../assets/css/estilo.css">
<link rel="stylesheet" href="assets/admin.css">
<!-- dados.js = "banco" provisório; admin.js = proteção por login (precisa ficar no head) -->
<script src="../assets/js/dados.js"></script>
<script src="assets/admin.js"></script>
</head>
<body class="admin-corpo">

<!-- =================== TOPO DO PAINEL (igual em todas as páginas) =================== -->
<header class="admin-topo">
  <a class="logo" href="painel.html" aria-label="Painel do Forninho da Lili, visão geral">
    <img class="logo-selo" src="../assets/img/logo-selo.jpg" alt="" width="44" height="44">
    <span class="logo-forninho">Forninho</span>
    <span class="logo-da">da</span>
    <span class="logo-lili">Lili</span>
    <span class="logo-papel">Painel</span>
  </a>
  <div class="admin-usuario">
    <span>Olá, <strong data-nome-usuario>Lili</strong></span>
    <a href="../index.html" target="_blank" rel="noopener">Ver o site</a>
    <button class="botao botao-mini botao-sair" type="button" data-sair>Sair</button>
  </div>
</header>

<div class="admin-app">
  <div class="painel">
    <nav class="painel-menu" aria-label="Menu do painel">
      <a href="painel.html">Visão geral</a>
      <a href="pedidos.html">Pedidos</a>
      <a href="produtos.html">Produtos</a>
      <a class="ativo" href="clientes.html" aria-current="page">Clientes</a>
    </nav>

    <main class="painel-corpo">
      <div class="painel-topo">
        <div>
          <h1 id="titulo-form">Novo cliente</h1>
          <p class="subtitulo"><a href="clientes.html" id="voltar">← Voltar para clientes</a></p>
        </div>
      </div>

      <p data-aviso hidden></p>

      <!-- Na versão PHP: <form method="post" action="cliente_salvar.php"> -->
      <form class="form-admin" id="form" novalidate>
        <input type="hidden" name="id">

        <div class="campo">
          <label for="nome">Nome <span class="obrigatorio">*</span></label>
          <input type="text" id="nome" name="nome" maxlength="80" autocomplete="off" required>
        </div>

        <div class="campos-lado">
          <div class="campo">
            <label for="telefone">Telefone / WhatsApp</label>
            <input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(11) 90000-0000">
          </div>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" maxlength="60">
          </div>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" maxlength="120">
        </div>

        <div class="form-acoes">
          <button class="botao" type="submit">Salvar cliente</button>
          <a class="botao botao-claro" href="clientes.html" id="cancelar">Cancelar</a>
        </div>
      </form>
    </main>
  </div>
</div>

<script>
  var db = LojaDB;
  var form = document.getElementById('form');
  var voltarPedido = Admin.param('voltar') === 'pedido';
  if (voltarPedido) {
    document.getElementById('voltar').href = document.getElementById('cancelar').href = 'pedido-form.html';
    document.getElementById('voltar').textContent = '← Voltar para o pedido';
  }

  var id = Admin.param('id');
  if (id) {
    var c = db.buscar('cliente', id);
    if (!c) { window.location.replace('clientes.html?msg=naoencontrado'); }
    else {
      document.getElementById('titulo-form').textContent = 'Editar cliente';
      document.title = 'Editar cliente | Painel Forninho da Lili';
      ['id', 'nome', 'telefone', 'cidade', 'email'].forEach(function (k) { form[k].value = c[k] || ''; });
    }
  }

  // Máscara simples de telefone: (11) 98765-4321
  form.telefone.addEventListener('input', function () {
    var n = form.telefone.value.replace(/\D/g, '').slice(0, 11);
    var t = n;
    if (n.length > 2) t = '(' + n.slice(0, 2) + ') ' + n.slice(2);
    if (n.length > 7) t = '(' + n.slice(0, 2) + ') ' + n.slice(2, n.length - 4) + '-' + n.slice(-4);
    form.telefone.value = t;
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var aviso = document.querySelector('[data-aviso]');
    var nome = form.nome.value.trim();
    var email = form.email.value.trim();
    var erro = '';
    if (!nome) erro = 'Informe o nome do cliente.';
    else if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) erro = 'O e-mail parece incompleto.';
    if (erro) { aviso.className = 'aviso aviso-erro'; aviso.textContent = erro; aviso.hidden = false; return; }

    var novo = !form.id.value;
    var clienteId = db.salvar('cliente', {
      id: novo ? null : Number(form.id.value),
      nome: nome,
      telefone: form.telefone.value.trim(),
      cidade: form.cidade.value.trim(),
      email: email
    });
    if (voltarPedido) window.location.href = 'pedido-form.html?cliente=' + clienteId;
    else window.location.href = 'clientes.html?msg=' + (novo ? 'criado' : 'salvo');
  });
</script>
</body>
</html>
