<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- O painel nunca deve aparecer no Google -->
<meta name="robots" content="noindex, nofollow">
<title>Produtos | Painel Forninho da Lili</title>
<link rel="icon" href="../assets/img/logo-selo.jpg">
<link rel="stylesheet" href="../assets/css/estilo.css">
<link rel="stylesheet" href="assets/admin.css">
<!-- dados.js = "banco" provisório; admin.js = proteção por login (precisa ficar no head) -->
<script src="../assets/js/dados.js"></script>
<script src="assets/admin.js"></script>
</head>
<body class="admin-corpo">

<!-- =================== TOPO DO PAINEL (igual em todas as páginas) =================== -->
<header class="admin-topo">
  <a class="logo" href="painel.html" aria-label="Painel do Forninho da Lili, visão geral">
    <img class="logo-selo" src="../assets/img/logo-selo.jpg" alt="" width="44" height="44">
    <span class="logo-forninho">Forninho</span>
    <span class="logo-da">da</span>
    <span class="logo-lili">Lili</span>
    <span class="logo-papel">Painel</span>
  </a>
  <div class="admin-usuario">
    <span>Olá, <strong data-nome-usuario>Lili</strong></span>
    <a href="../index.html" target="_blank" rel="noopener">Ver o site</a>
    <button class="botao botao-mini botao-sair" type="button" data-sair>Sair</button>
  </div>
</header>

<div class="admin-app">
  <div class="painel">
    <nav class="painel-menu" aria-label="Menu do painel">
      <a href="painel.html">Visão geral</a>
      <a href="pedidos.html">Pedidos</a>
      <a class="ativo" href="produtos.html" aria-current="page">Produtos</a>
      <a href="clientes.html">Clientes</a>
    </nav>

    <main class="painel-corpo">
      <div class="painel-topo">
        <div>
          <h1>Produtos</h1>
          <p class="subtitulo">O que aparece no cardápio do site.</p>
        </div>
        <a class="botao" href="produto-form.html">+ Novo produto</a>
      </div>

      <p data-aviso hidden></p>

      <form class="ferramentas" role="search" onsubmit="return false">
        <label class="campo-busca">Buscar
          <input type="search" id="busca" placeholder="Nome do produto">
        </label>
        <label>Categoria
          <select id="filtro-categoria"><option value="">Todas</option></select>
        </label>
        <label>Situação
          <select id="filtro-situacao">
            <option value="">Todas</option>
            <option value="1">No cardápio</option>
            <option value="0">Desativados</option>
          </select>
        </label>
      </form>

      <div class="bloco" style="margin-top:1rem">
        <table class="tabela">
          <thead>
            <tr><th scope="col">Produto</th><th scope="col">Categoria</th><th scope="col">Preço</th><th scope="col">Situação</th><th scope="col">Ações</th></tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p class="rodape-tabela" id="contador"></p>
    </main>
  </div>
</div>

<script>
  var db = LojaDB, esc = db.esc;

  Admin.mostrarAviso({
    criado: 'Produto cadastrado! Ele já aparece no cardápio do site.',
    salvo: 'Alterações salvas.',
    excluido: 'Produto excluído.',
    desativado: 'Produto desativado: saiu do cardápio, mas continua nos pedidos antigos.',
    ativado: 'Produto ativado: voltou a aparecer no cardápio.',
    naoencontrado: { texto: 'Produto não encontrado.', erro: true }
  });

  var selCat = document.getElementById('filtro-categoria');
  db.CATEGORIAS.forEach(function (c) { selCat.add(new Option(c.nome, c.id)); });

  function vendasDoProduto(id) {
    return db.listar('pedido_item').filter(function (i) { return i.produto_id === id; }).length;
  }

  function desenhar() {
    var busca = document.getElementById('busca').value.trim().toLowerCase();
    var cat = selCat.value;
    var sit = document.getElementById('filtro-situacao').value;
    var todos = db.listar('produto');
    var lista = todos.filter(function (p) {
      return (!busca || p.nome.toLowerCase().indexOf(busca) !== -1) &&
        (!cat || p.categoria === cat) &&
        (sit === '' || String(Number(p.ativo)) === sit);
    }).sort(function (a, b) {
      return (b.ativo - a.ativo) || a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome);
    });

    document.getElementById('lista').innerHTML = lista.length ? lista.map(function (p) {
      var ativo = Number(p.ativo) === 1;
      var foto = p.imagem
        ? '<img class="miniatura" src="' + esc(db.urlImagem(p.imagem, '../')) + '" alt="" width="88" height="88">'
        : '<span class="miniatura miniatura-vazia" title="Sem foto"></span>';
      return '<tr' + (ativo ? '' : ' class="linha-inativa"') + '>' +
        '<td class="td-nome"><span>' + foto + '<span>' + esc(p.nome) +
          (p.descricao ? '<span class="td-sub">' + esc(p.descricao) + '</span>' : '') + '</span></span></td>' +
        '<td data-rotulo="Categoria">' + esc(db.nomeCategoria(p.categoria)) + '</td>' +
        '<td data-rotulo="Preço">' + db.dinheiro(p.preco) + '</td>' +
        '<td data-rotulo="Situação"><span class="status' + (ativo ? '' : ' status-inativo') + '">' + (ativo ? 'No cardápio' : 'Desativado') + '</span></td>' +
        '<td class="td-acoes">' +
          '<a class="botao botao-claro botao-mini" href="produto-form.html?id=' + p.id + '">Editar</a>' +
          '<button class="botao botao-claro botao-mini" type="button" data-alternar="' + p.id + '">' + (ativo ? 'Desativar' : 'Ativar') + '</button>' +
          '<button class="botao botao-claro botao-mini" type="button" data-excluir="' + p.id + '">Excluir</button>' +
        '</td></tr>';
    }).join('') : '<tr><td class="tabela-vazia" colspan="5">Nenhum produto encontrado.</td></tr>';

    var ativos = todos.filter(function (p) { return Number(p.ativo) === 1; }).length;
    document.getElementById('contador').textContent =
      todos.length + ' produto(s) cadastrado(s): ' + ativos + ' no cardápio e ' + (todos.length - ativos) + ' desativado(s).';
  }

  function irPara(msg) { window.location.href = 'produtos.html?msg=' + msg; }

  function alternar(id) {
    var p = db.buscar('produto', id);
    p.ativo = Number(p.ativo) === 1 ? 0 : 1;
    db.salvar('produto', p);
    irPara(p.ativo ? 'ativado' : 'desativado');
  }

  function excluir(id) {
    var p = db.buscar('produto', id);
    var usos = vendasDoProduto(id);
    if (usos > 0) {
      // Produto que já foi vendido não pode sumir: os pedidos antigos dependem dele
      Admin.confirmar({
        titulo: 'Este produto não pode ser excluído',
        html: '<b>' + esc(p.nome) + '</b> aparece em ' + usos + ' pedido(s). Excluir apagaria parte do histórico de vendas. ' +
          (Number(p.ativo) === 1 ? 'Você pode <b>desativá-lo</b>: ele sai do cardápio e continua guardado nos pedidos.' : 'Ele já está desativado e não aparece no site.'),
        botao: Number(p.ativo) === 1 ? 'Desativar produto' : '',
        cancelar: 'Voltar'
      }).then(function (ok) { if (ok) alternar(id); });
      return;
    }
    Admin.confirmar({
      titulo: 'Excluir produto?',
      html: 'Tem certeza que deseja excluir <b>' + esc(p.nome) + '</b>? Essa ação não pode ser desfeita.',
      botao: 'Sim, excluir', perigo: true
    }).then(function (ok) {
      if (ok) { db.excluir('produto', id); irPara('excluido'); }
    });
  }

  document.getElementById('lista').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.alternar) alternar(Number(b.dataset.alternar));
    if (b.dataset.excluir) excluir(Number(b.dataset.excluir));
  });
  ['busca', 'filtro-categoria', 'filtro-situacao'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', desenhar);
  });
  desenhar();
</script>
</body>
</html>
