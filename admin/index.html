<!DOCTYPE html>
<html lang="pt-BR" data-login>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- O painel nunca deve aparecer no Google -->
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Painel Forninho da Lili</title>
<link rel="icon" href="../assets/img/logo-selo.jpg">
<link rel="stylesheet" href="../assets/css/estilo.css">
<link rel="stylesheet" href="assets/admin.css">
<!-- dados.js = "banco" provisório; admin.js = proteção por login (precisa ficar no head) -->
<script src="../assets/js/dados.js"></script>
<script src="assets/admin.js"></script>
</head>
<body class="admin-corpo login-pagina">

<main class="login-caixa">
  <a class="logo" href="../index.html" aria-label="Forninho da Lili, voltar ao site">
    <img class="logo-selo" src="../assets/img/logo-selo.jpg" alt="" width="52" height="52">
    <span class="logo-forninho">Forninho</span>
    <span class="logo-da">da</span>
    <span class="logo-lili">Lili</span>
  </a>

  <!-- Na versão PHP: <form method="post" action="login.php"> -->
  <form class="login-form" id="form-login" novalidate>
    <h1>Área restrita</h1>
    <p class="intro">Entre para ver pedidos, produtos e clientes.</p>

    <p class="aviso aviso-erro" id="erro-login" role="alert" hidden>Usuário ou senha incorretos.</p>

    <div class="campo">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        <button class="mostrar-senha" type="button" id="mostrar-senha" aria-pressed="false">Mostrar</button>
      </div>
    </div>

    <button class="botao" type="submit">Entrar</button>
  </form>

    <p class="login-demo">Acesso exclusivo da equipe Forninho da Lili.</p>
  <a class="login-voltar" href="../index.html">← Voltar para o site</a>
</main>

<script>
  // Quem já está logado vai direto para o painel
  if (Admin.logado()) window.location.replace('painel.html');

  var form = document.getElementById('form-login');
  var erro = document.getElementById('erro-login');
  var senha = document.getElementById('senha');
  var botaoVer = document.getElementById('mostrar-senha');

  botaoVer.addEventListener('click', function () {
    var mostrar = senha.type === 'password';
    senha.type = mostrar ? 'text' : 'password';
    botaoVer.textContent = mostrar ? 'Ocultar' : 'Mostrar';
    botaoVer.setAttribute('aria-pressed', String(mostrar));
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var usuario = form.usuario.value;
    if (!usuario.trim() || !senha.value) {
      erro.textContent = 'Preencha usuário e senha.';
      erro.hidden = false;
      return;
    }
    if (Admin.entrar(usuario, senha.value)) {
      window.location.replace('painel.html');
    } else {
      erro.textContent = 'Usuário ou senha incorretos.';
      erro.hidden = false;
      senha.value = '';
      senha.focus();
    }
  });
</script>
</body>
</html>
